.lang{position:relative;z-index:30}

.lang-menu li{position:relative;padding:9px 20px 9px 32px;color:#c9bea7;font-family:"Noto Serif TC","Source Han Serif TC","PMingLiU",serif;

.lang-menu li:hover,.lang-menu li:focus{background:rgba(216,189,132,.12);color:#fff;outline:none}
.lang-menu li.on{color:#e8c98a}

// 用法：initLangMenu(langs, current, onPick)；langs＝[{code,label}]，onPick(code) 由頁面負責套用與存 localStorage。
//       setLangMenu(code) 更新按鈕文字與選中標記。
function initLangMenu(langs, onPick) {
  var box = document.getElementById('lang'), btn = document.getElementById('langBtn'), menu = document.getElementById('langMenu');
  langs.forEach(function (x) {
    var li = document.createElement('li');
    li.textContent = x.label; li.setAttribute('data-code', x.code); li.setAttribute('role', 'option'); li.tabIndex = -1;
    li.addEventListener('click', function () { close(); onPick(x.code); });
    li.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); li.click(); }
      if (e.key === 'ArrowDown' && li.nextSibling) { e.preventDefault(); li.nextSibling.focus(); }
      if (e.key === 'ArrowUp' && li.previousSibling) { e.preventDefault(); li.previousSibling.focus(); }
    });
    menu.appendChild(li);
  });
  function open() { box.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); var on = menu.querySelector('.on') || menu.firstChild; if (on) on.focus(); }
  function close() { box.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
  btn.addEventListener('click', function (e) { e.stopPropagation(); box.classList.contains('open') ? close() : open(); });
  document.addEventListener('click', function (e) { if (!box.contains(e.target)) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { close(); btn.focus(); } });
}
function setLangMenu(code, label) {
  document.getElementById('langCur').textContent = label;
  [].forEach.call(document.querySelectorAll('#langMenu li'), function (li) {
    var on = li.getAttribute('data-code') === code; li.classList.toggle('on', on); li.setAttribute('aria-selected', on ? 'true' : 'false');
  });
}
(function () {
  var t = document.querySelector('.totop'); if (!t) return;
  function upd() { t.classList.toggle('show', window.scrollY > 500); }
  window.addEventListener('scroll', upd, { passive: true }); upd();
})();

</script>
<script>
var EDS = [{"date": "2026-10-29", "title": {"tw": "試玩版後更新・開發進度", "cn": "试玩版后更新・开发进度", "en": "Post-Demo Update・Development Progress", "ja": "体験版以降のアップデート・開発状況", "ko": "체험판 이후 업데이트・개발 현황", "ru": "Обновления после демо・Ход разработки"}, "file": "2026-10-29.html"}], LBL = {"hist": {"tw": "歷史回顧", "cn": "历史回顾", "en": "Past Updates", "ja": "過去の更新", "ko": "지난 업데이트", "ru": "Архив"}, "back_latest": {"tw": "‹ 回到最新一期", "cn": "‹ 回到最新一期", "en": "‹ Back to latest", "ja": "‹ 最新号へ戻る", "ko": "‹ 최신 호로 돌아가기", "ru": "‹ К последнему выпуску"}, "latest": {"tw": "最新", "cn": "最新", "en": "Latest", "ja": "最新", "ko": "최신", "ru": "Новое"}, "title": {"tw": "閃光雞雞海賊團 | 更新週報", "cn": "闪光鸡鸡海贼团 | 更新周报", "en": "Glowstick Pirates | Weekly Update", "ja": "ピカチン海賊団 | アップデート週報", "ko": "Glowstick Pirates | 주간 업데이트", "ru": "Glowstick Pirates | Еженедельное обновление"}}, LANGS = [{"code": "tw", "label": "繁體中文", "html": "zh-Hant-TW"}, {"code": "cn", "label": "简体中文", "html": "zh-Hans-CN"}, {"code": "en", "label": "English", "html": "en"}, {"code": "ja", "label": "日本語", "html": "ja"}, {"code": "ko", "label": "한국어", "html": "ko"}, {"code": "ru", "label": "Русский", "html": "ru"}], KEY = 'gp_lang';
function detect(){var a=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'];for(var i=0;i<a.length;i++){var l=(a[i]||'').toLowerCase();if(/^zh-(tw|hk|mo)|^zh-hant/.test(l))return'tw';if(/^zh/.test(l))return'cn';if(/^ja/.test(l))return'ja';if(/^ko/.test(l))return'ko';if(/^(ru|uk|be|kk)/.test(l))return'ru';if(/^en/.test(l))return'en';}return'en';}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function render(lang){
  document.title=LBL.title[lang]; document.getElementById('h').textContent=LBL.hist[lang]; document.getElementById('back').textContent=LBL.back_latest[lang].replace(/^‹ */,"");
  document.getElementById('list').innerHTML=EDS.map(function(e,i){return '<a class="row" href="'+e.file+'"><span class="d">'+e.date.replace(/-/g,'.')+'</span><span class="t">'+esc(e.title[lang]||e.title.tw)+'</span>'+(i===0?'<span class="new">'+LBL.latest[lang]+'</span>':'')+'</a>';}).join('');
  var m=LANGS.filter(function(x){return x.code===lang;})[0]; document.documentElement.lang=m?m.html:lang; setLangMenu(lang, m?m.label:lang);
}
initLangMenu(LANGS,function(c){try{localStorage.setItem(KEY,c);}catch(e){}render(c);});
var saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
render(saved&&LBL.title[saved]?saved:detect());
</script></body></html>
